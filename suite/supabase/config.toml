# Supabase CLI configuration for LOCAL development (`supabase start` / `supabase db reset`).
# Requires Docker. In environments without Docker use scripts/local-reset.sh against a
# plain PostgreSQL 17 (see local/README.md for the documented differences).
# Nothing in this file is a hosted credential. Hosted linking happens only at the
# FINAL gate by the owner (docs/DEPLOYMENT.md).

project_id = "suite-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
# Keep list responses bounded; DAL pagination (CF-04) never relies on a larger page.
max_rows = 200

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1m0s"

[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[analytics]
enabled = false

[edge_runtime]
enabled = false
